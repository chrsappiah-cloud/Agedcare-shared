name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "release/**", "ci/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Agedcare-shared.xcodeproj
  SCHEME: Agedcare-shared

jobs:

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: |
          set +e
          swiftlint lint --reporter github-actions-logging
          status=$?
          echo "swiftlint_exit_code=$status" >> "$GITHUB_ENV"
          if [ "$status" -ne 0 ]; then
            {
              echo "### SwiftLint reported repo-wide violations"
              echo ""
              echo "Lint remains advisory until the existing baseline is reduced."
              echo "Build and tests stay enforced."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

  worker-syntax:
    name: Cloudflare Worker Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate worker syntax
        run: |
          if [ -f Agedcare-shared/cloudflare-worker/src/index.js ]; then
            node --check Agedcare-shared/cloudflare-worker/src/index.js
          else
            echo "No Cloudflare worker present"
          fi

  # ── Build & Unit Tests ───────────────────────────────────────────────────
  build-and-test:
    name: Build & Unit Tests
    runs-on: macos-26
    timeout-minutes: 30
    needs: [lint, worker-syntax]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve available simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DESTINATION_LINE=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations 2>/dev/null | awk '/platform:iOS Simulator/ && /name:iPhone/ { line=$0 } END { print line }')
          if [ -z "${DESTINATION_LINE:-}" ]; then
            echo "No iPhone simulator destination was found." >&2
            exit 1
          fi
          SIMULATOR_ID=$(printf '%s\n' "$DESTINATION_LINE" | sed -E 's/.*id:([^,]+), OS:.*/\1/')
          SIMULATOR_NAME=$(printf '%s\n' "$DESTINATION_LINE" | sed -E 's/.*name:([^}]*) }.*/\1/')
          if [ -z "${SIMULATOR_ID:-}" ] || [ "$SIMULATOR_ID" = "$DESTINATION_LINE" ]; then
            echo "Unable to resolve simulator UDID from: $DESTINATION_LINE" >&2
            exit 1
          fi
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          echo "name=$SIMULATOR_NAME" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -destination-timeout 180 \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -destination-timeout 180 \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -only-testing:Agedcare-sharedTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Code Coverage Report
        if: always()
        run: |
          if [ -d "TestResults.xcresult" ]; then
            xcrun xccov view --report TestResults.xcresult \
              | grep -E '(Agedcare-shared\.app|\.swift)' | head -25
          fi

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults.xcresult
          retention-days: 14

  # ── Hero Page UI Tests ───────────────────────────────────────────────────
  ui-test:
    name: Hero Page UI Tests
    runs-on: macos-26
    timeout-minutes: 45
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Resolve available simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DESTINATION_LINE=$(xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations 2>/dev/null | awk '/platform:iOS Simulator/ && /name:iPhone/ { line=$0 } END { print line }')
          if [ -z "${DESTINATION_LINE:-}" ]; then
            echo "No iPhone simulator destination was found." >&2
            exit 1
          fi
          SIMULATOR_ID=$(printf '%s\n' "$DESTINATION_LINE" | sed -E 's/.*id:([^,]+), OS:.*/\1/')
          if [ -z "${SIMULATOR_ID:-}" ] || [ "$SIMULATOR_ID" = "$DESTINATION_LINE" ]; then
            echo "Unable to resolve simulator UDID from: $DESTINATION_LINE" >&2
            exit 1
          fi
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Run UI Tests (Hero Page)
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -destination-timeout 180 \
            -resultBundlePath UITestResults.xcresult \
            -only-testing:Agedcare-sharedUITests/Agedcare_sharedUITests/testHeroPageShowsPanelRouter \
            -only-testing:Agedcare-sharedUITests/Agedcare_sharedUITests/testResidentPanelCardVisible \
            -only-testing:Agedcare-sharedUITests/Agedcare_sharedUITests/testStaffPanelCardVisible \
            -only-testing:Agedcare-sharedUITests/Agedcare_sharedUITests/testBothPanelCardsCoexist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 14
