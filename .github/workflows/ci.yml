name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "release/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  # ── Build & Unit Tests ───────────────────────────────────────────────────
  build-and-test:
    name: Build & Unit Tests
    runs-on: macos-26
    timeout-minutes: 30
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project Agedcare-shared.xcodeproj \
            -scheme Agedcare-shared \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project Agedcare-shared.xcodeproj \
            -scheme Agedcare-shared \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -only-testing:Agedcare-sharedTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Code Coverage Report
        if: always()
        run: |
          if [ -d "TestResults.xcresult" ]; then
            xcrun xccov view --report TestResults.xcresult \
              | grep -E '(Agedcare-shared\.app|\.swift)' | head -25
          fi

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults.xcresult
          retention-days: 14

  # ── Hero Page UI Tests ───────────────────────────────────────────────────
  ui-test:
    name: Hero Page UI Tests
    runs-on: macos-26
    timeout-minutes: 45
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Run UI Tests (Hero Page)
        run: |
          xcodebuild test \
            -project Agedcare-shared.xcodeproj \
            -scheme Agedcare-shared \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -resultBundlePath UITestResults.xcresult \
            -only-testing:Agedcare-sharedUITests/Agedcare_sharedUITests/testHeroPageShowsPanelRouter \
            -only-testing:Agedcare-sharedUITests/Agedcare_sharedUITests/testResidentPanelCardVisible \
            -only-testing:Agedcare-sharedUITests/Agedcare_sharedUITests/testStaffPanelCardVisible \
            -only-testing:Agedcare-sharedUITests/Agedcare_sharedUITests/testBothPanelCardsCoexist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 14
