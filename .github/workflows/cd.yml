name: CD — TestFlight (Production)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 1.0.1). Leave blank to keep current."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: Agedcare-shared.xcodeproj
  SCHEME: Agedcare-shared
  CONFIGURATION: Release
  IPA_NAME: Agedcare-shared.ipa
  TEAM_ID: TM2WG7HH96

jobs:
  archive-and-upload:
    name: Archive & Upload to TestFlight
    runs-on: macos-26
    environment: production
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pre-flight — verify required signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            {
              echo "### ❌ Missing required GitHub Actions secrets"
              echo ""
              echo "The following repository secrets must be configured before this workflow can sign and upload to TestFlight with App Store Connect cloud signing:"
              echo ""
              for s in "${missing[@]}"; do echo "- \`$s\`"; done
              echo ""
              echo "Configure them at: **Settings → Secrets and variables → Actions → New repository secret**"
              echo ""
              echo "See \`docs/CI_SECRETS.md\` for exact values and base64 encoding instructions."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "✅ All required App Store Connect secrets are present"
          if [ -n "${BUILD_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "✅ App Store provisioning profile secret is present"
          else
            echo "ℹ️ No BUILD_PROVISION_PROFILE_BASE64 secret set; export will rely on cloud-managed profiles"
          fi
          if [ -n "${BUILD_CERTIFICATE_BASE64:-}" ] && [ -n "${BUILD_CERTIFICATE_PASSWORD:-}" ]; then
            echo "✅ Distribution certificate secrets are present"
          else
            echo "ℹ️ No BUILD_CERTIFICATE_BASE64 / BUILD_CERTIFICATE_PASSWORD secret set; archive will rely on cloud signing"
          fi

      - name: Resolve marketing version + build number
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            MV="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.marketing_version }}" ]]; then
            MV="${{ inputs.marketing_version }}"
          else
            MV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Agedcare-shared/Info.plist 2>/dev/null \
              || grep -m1 "MARKETING_VERSION" "$PROJECT/project.pbxproj" | sed -E 's/.*= ([^;]+);/\1/' | tr -d ' "')
          fi
          BN="$(( 100 + ${{ github.run_number }} ))"
          echo "marketing=$MV" >> "$GITHUB_OUTPUT"
          echo "build=$BN" >> "$GITHUB_OUTPUT"
          echo "Marketing version: $MV"
          echo "Build number:      $BN"

      - name: Stamp project with version + build
        run: |
          cd "$(dirname "$PROJECT")"
          xcrun agvtool new-marketing-version "${{ steps.version.outputs.marketing }}"
          xcrun agvtool new-version -all "${{ steps.version.outputs.build }}"

      - name: Prepare App Store Connect API key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_PRIVATE_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          echo -n "$ASC_PRIVATE_KEY_BASE64" | base64 --decode \
            -o "$RUNNER_TEMP/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

      - name: Install App Store provisioning profile
        id: provisioning
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "No BUILD_PROVISION_PROFILE_BASE64 secret configured; skipping profile install."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode \
            -o "$RUNNER_TEMP/Agedcare-shared.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/Agedcare-shared.mobileprovision" > "$RUNNER_TEMP/Agedcare-shared-profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/Agedcare-shared-profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/Agedcare-shared-profile.plist")
          cp "$RUNNER_TEMP/Agedcare-shared.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "installed=true" >> "$GITHUB_OUTPUT"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Install distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ] || [ -z "${BUILD_CERTIFICATE_PASSWORD:-}" ]; then
            echo "No distribution certificate secrets configured; skipping certificate install."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$BUILD_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$BUILD_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$BUILD_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"

      - name: Archive (Release)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ] || [ "${{ steps.provisioning.outputs.installed }}" != "true" ]; then
            xcodebuild archive \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
              -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
              -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
              | tee "$RUNNER_TEMP/archive.log"
          else
            xcodebuild archive \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE="${{ steps.provisioning.outputs.uuid }}" \
              PROVISIONING_PROFILE_SPECIFIER="${{ steps.provisioning.outputs.name }}" \
              | tee "$RUNNER_TEMP/archive.log"
          fi
          test -d "$RUNNER_TEMP/$SCHEME.xcarchive"

      - name: Export IPA
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath "$RUNNER_TEMP/export" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
              -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
              -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          else
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath "$RUNNER_TEMP/export"
          fi
          ls -la "$RUNNER_TEMP/export"

      - name: Validate IPA against App Store Connect
        run: |
          xcrun altool --validate-app \
            --type ios \
            --file "$RUNNER_TEMP/export/$IPA_NAME" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            --output-format xml

      - name: Upload to TestFlight (with retry)
        run: |
          for attempt in 1 2 3; do
            echo "::group::Upload attempt $attempt"
            if xcrun altool --upload-app \
                --type ios \
                --file "$RUNNER_TEMP/export/$IPA_NAME" \
                --apiKey "${{ secrets.ASC_KEY_ID }}" \
                --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
                --output-format xml; then
              echo "::endgroup::"
              echo "✅ Upload succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "⚠️  Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          echo "❌ Upload failed after 3 attempts"
          exit 1

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agedcare-shared-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload xcarchive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agedcare-shared-xcarchive
          path: ${{ runner.temp }}/Agedcare-shared.xcarchive
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: |
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8 "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/build_certificate.p12 || true
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## TestFlight upload summary"
            echo "| | |"
            echo "|---|---|"
            echo "| Marketing version | \`${{ steps.version.outputs.marketing }}\` |"
            echo "| Build number      | \`${{ steps.version.outputs.build }}\` |"
            echo "| Configuration     | \`$CONFIGURATION\` |"
            echo "| Team              | \`$TEAM_ID\` |"
            echo "| Triggered by      | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
