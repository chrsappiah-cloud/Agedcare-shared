name: iOS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  unit-tests:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve available simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DESTINATION=$(xcodebuild -project Agedcare-shared.xcodeproj -scheme Agedcare-shared -showdestinations 2>/dev/null | grep -Eo "platform:iOS Simulator,.*name:[^}]*" | grep -m1 "iPhone")
          if [ -z "${DESTINATION:-}" ]; then
            echo "No iPhone simulator destination was found." >&2
            exit 1
          fi
          DEVICE_NAME=$(printf '%s\n' "$DESTINATION" | sed -E 's/.*name:([^,]+).*/\1/')
          echo "destination=platform=iOS Simulator,name=${DEVICE_NAME},OS=latest" >> "$GITHUB_OUTPUT"

      - name: Run native iOS tests
        run: |
          xcodebuild \
            -project Agedcare-shared.xcodeproj \
            -scheme Agedcare-shared \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:Agedcare-sharedTests \
            test
