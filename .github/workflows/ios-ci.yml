name: iOS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve available simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DESTINATION_LINE=$(xcodebuild -project Agedcare-shared.xcodeproj -scheme Agedcare-shared -showdestinations 2>/dev/null | awk '/platform:iOS Simulator/ && /name:iPhone/ { line=$0 } END { print line }')
          if [ -z "${DESTINATION_LINE:-}" ]; then
            echo "No iPhone simulator destination was found." >&2
            exit 1
          fi
          SIMULATOR_ID=$(printf '%s\n' "$DESTINATION_LINE" | sed -E 's/.*id:([^,]+), OS:.*/\1/')
          SIMULATOR_NAME=$(printf '%s\n' "$DESTINATION_LINE" | sed -E 's/.*name:([^}]*) }.*/\1/')
          if [ -z "${SIMULATOR_ID:-}" ] || [ "$SIMULATOR_ID" = "$DESTINATION_LINE" ]; then
            echo "Unable to resolve simulator UDID from: $DESTINATION_LINE" >&2
            exit 1
          fi
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          echo "name=$SIMULATOR_NAME" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Run native iOS tests
        run: |
          xcodebuild \
            -project Agedcare-shared.xcodeproj \
            -scheme Agedcare-shared \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -destination-timeout 180 \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:Agedcare-sharedTests \
            test
