name: iOS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve available simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DESTINATION=$(xcrun simctl list devices available --json | jq -r '
            [
              .devices
              | to_entries[]
              | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))
              | .key as $runtime
              | .value[]
              | select(.isAvailable == true and (.name | startswith("iPhone")))
              | {
                  runtime: ($runtime | sub("com.apple.CoreSimulator.SimRuntime.iOS-"; "") | split("-") | map(tonumber? // 0)),
                  name,
                  udid
                }
            ]
            | sort_by(.runtime[0], .runtime[1], .runtime[2], .name)
            | last // empty
            | [.udid, .name]
            | @tsv
          ')
          if [ -z "${DESTINATION:-}" ]; then
            echo "No iPhone simulator destination was found." >&2
            exit 1
          fi
          SIMULATOR_ID=$(printf '%s\n' "$DESTINATION" | cut -f1)
          SIMULATOR_NAME=$(printf '%s\n' "$DESTINATION" | cut -f2-)
          if [ -z "${SIMULATOR_ID:-}" ]; then
            echo "Unable to resolve simulator UDID from: $DESTINATION" >&2
            exit 1
          fi
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          echo "name=$SIMULATOR_NAME" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Run native iOS tests
        run: |
          xcodebuild \
            -project Agedcare-shared.xcodeproj \
            -scheme Agedcare-shared \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -destination-timeout 180 \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:Agedcare-sharedTests \
            test
