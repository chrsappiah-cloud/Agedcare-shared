name: CD — Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            {
              echo "### Cloudflare deploy skipped"
              echo ""
              echo "Missing required secrets:"
              for s in "${missing[@]}"; do echo "- \`$s\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Missing Cloudflare secrets: ${missing[*]}"
            exit 0
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cloudflare-worker/package.json

      - name: Install worker dependencies
        working-directory: cloudflare-worker
        run: npm install

      - name: Sync worker secrets
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPLE_SHARED_SECRET: ${{ secrets.APPLE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_SHARED_SECRET:-}" ]; then
            echo "::warning::APPLE_SHARED_SECRET is not set; receipt validation endpoint will remain unavailable"
          else
            printf '%s' "$APPLE_SHARED_SECRET" | npx wrangler secret put APPLE_SHARED_SECRET
          fi

      - name: Deploy to Cloudflare Workers
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PRIMARY_API_URL: ${{ vars.PRIMARY_API_URL }}
          AI_API_URL: ${{ vars.AI_API_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: npx wrangler deploy
