# SwiftLint configuration for Agedcare-shared
# Keeps quality high while not blocking CI on stylistic test-helper noise.

included:
  - Agedcare-shared
  - Agedcare-sharedTests
  - Agedcare-sharedUITests

excluded:
  - build
  - DerivedData
  - "**/.build"

disabled_rules:
  - trailing_whitespace
  - todo
  - large_tuple
  - trailing_comma
  - comma
  - vertical_whitespace
  - non_optional_string_data_conversion
  - force_cast
  - force_try
  - identifier_name
  - type_name
  - line_length

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - sorted_first_last
  - contains_over_first_not_nil

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 1000

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level: 3

reporter: "github-actions-logging"
