<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33AB54"/>
      <stop offset="50%" stop-color="#1C7836"/>
      <stop offset="100%" stop-color="#0E3D1B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>

  <!-- Floating accents -->
  <circle cx="160" cy="280" r="22" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="900" cy="420" r="36" fill="#FFFFFF" opacity="0.14"/>
  <circle cx="220" cy="1700" r="48" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="880" cy="1680" r="20" fill="#C21F33" opacity="0.7"/>

  <!-- App icon -->
  <g filter="url(#shadow)" transform="translate(340,440)">
    <rect width="400" height="400" rx="90" fill="#FFFFFF"/>
    <image href="app_icon.png" x="0" y="0" width="400" height="400"/>
  </g>

  <!-- Wordmark -->
  <text x="540" y="990" font-family="Helvetica Neue, Helvetica, Arial" font-size="58" font-weight="800"
        text-anchor="middle" fill="#FFFFFF" letter-spacing="6">AGED CARE SHARED</text>

  <!-- Headline -->
  <text x="540" y="1170" font-family="Helvetica Neue, Helvetica, Arial" font-size="96" font-weight="800"
        text-anchor="middle" fill="#FFFFFF">Now live on</text>
  <text x="540" y="1280" font-family="Helvetica Neue, Helvetica, Arial" font-size="96" font-weight="800"
        text-anchor="middle" fill="#F5F7FA">TestFlight.</text>

  <text x="540" y="1380" font-family="Helvetica Neue, Helvetica, Arial" font-size="36" font-weight="400"
        text-anchor="middle" fill="#F5F7FA" opacity="0.9">Join the beta and reshape aged care with us.</text>

  <!-- CTA button -->
  <g transform="translate(240,1500)" filter="url(#shadow)">
    <rect width="600" height="120" rx="60" fill="#FFFFFF"/>
    <text x="300" y="78" font-family="Helvetica Neue, Helvetica, Arial" font-size="42" font-weight="800"
          text-anchor="middle" fill="#1C7836">Request access</text>
  </g>

  <!-- Footer -->
  <text x="540" y="1740" font-family="Helvetica Neue, Helvetica, Arial" font-size="24" font-weight="400"
        text-anchor="middle" fill="#F5F7FA" opacity="0.85">v1.0.1 · iOS 18 · iPhone &amp; iPad</text>
  <text x="540" y="1780" font-family="Helvetica Neue, Helvetica, Arial" font-size="24" font-weight="400"
        text-anchor="middle" fill="#F5F7FA" opacity="0.6">© World Class Scholars · Made with care</text>
</svg>
