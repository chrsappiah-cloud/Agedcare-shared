<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C7836"/>
      <stop offset="100%" stop-color="#0E3D1B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#33AB54" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#33AB54" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>

  <!-- Floating accent dots -->
  <circle cx="160" cy="280" r="20" fill="#F5F7FA" opacity="0.18"/>
  <circle cx="900" cy="420" r="32" fill="#F5F7FA" opacity="0.12"/>
  <circle cx="240" cy="1620" r="48" fill="#F5F7FA" opacity="0.08"/>
  <circle cx="880" cy="1700" r="18" fill="#C21F33" opacity="0.6"/>

  <!-- App icon centered -->
  <g filter="url(#shadow)" transform="translate(290,560)">
    <rect width="500" height="500" rx="112" fill="#FFFFFF"/>
    <image href="app_icon.png" x="0" y="0" width="500" height="500"/>
  </g>

  <!-- Headline -->
  <text x="540" y="1220" font-family="Helvetica Neue, Helvetica, Arial" font-size="104" font-weight="800"
        text-anchor="middle" fill="#FFFFFF">Aged Care,</text>
  <text x="540" y="1340" font-family="Helvetica Neue, Helvetica, Arial" font-size="104" font-weight="800"
        text-anchor="middle" fill="#F5F7FA">Reimagined.</text>

  <text x="540" y="1430" font-family="Helvetica Neue, Helvetica, Arial" font-size="38" font-weight="400"
        text-anchor="middle" fill="#F5F7FA" opacity="0.9">Compassionate care, intelligently connected.</text>
</svg>
