<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33AB54"/>
      <stop offset="100%" stop-color="#1C7836"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- Top emerald banner -->
  <rect x="0" y="0" width="1080" height="360" fill="url(#emerald)"/>
  <polygon points="0,360 1080,260 1080,360" fill="#1C7836" opacity="0.6"/>

  <!-- Wordmark -->
  <text x="540" y="120" font-family="Helvetica Neue, Helvetica, Arial" font-size="38" font-weight="700"
        text-anchor="middle" fill="#FFFFFF" letter-spacing="4">AGED CARE SHARED</text>
  <text x="540" y="170" font-family="Helvetica Neue, Helvetica, Arial" font-size="22" font-weight="400"
        text-anchor="middle" fill="#F5F7FA" opacity="0.95">A modern iOS platform for residential aged care</text>

  <!-- App icon card overlapping banner -->
  <g filter="url(#shadow)" transform="translate(380,250)">
    <rect width="320" height="320" rx="72" fill="#FFFFFF"/>
    <image href="app_icon.png" x="0" y="0" width="320" height="320"/>
  </g>

  <!-- Headline -->
  <text x="540" y="640" font-family="Helvetica Neue, Helvetica, Arial" font-size="64" font-weight="800"
        text-anchor="middle" fill="#452917">Aged Care, Reimagined.</text>
  <text x="540" y="690" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" font-weight="400"
        text-anchor="middle" fill="#734D33">Compassionate care, intelligently connected.</text>

  <!-- Feature blocks -->
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <g transform="translate(90,760)" filter="url(#shadow)">
      <rect width="900" height="110" rx="22" fill="#FFFFFF"/>
      <circle cx="60" cy="55" r="26" fill="#C21F33"/>
      <text x="100" y="50" font-size="28" font-weight="700" fill="#452917">Instant SOS &amp; smart alerts</text>
      <text x="100" y="82" font-size="22" font-weight="400" fill="#734D33">CloudKit-synced incident escalation across the care team</text>
    </g>
    <g transform="translate(90,890)" filter="url(#shadow)">
      <rect width="900" height="110" rx="22" fill="#FFFFFF"/>
      <circle cx="60" cy="55" r="26" fill="#33AB54"/>
      <text x="100" y="50" font-size="28" font-weight="700" fill="#452917">WeatherKit + indoor comfort</text>
      <text x="100" y="82" font-size="22" font-weight="400" fill="#734D33">Live outdoor weather and estimated room temperature per resident</text>
    </g>
    <g transform="translate(90,1020)" filter="url(#shadow)">
      <rect width="900" height="110" rx="22" fill="#FFFFFF"/>
      <circle cx="60" cy="55" r="26" fill="#1C7836"/>
      <text x="100" y="50" font-size="28" font-weight="700" fill="#452917">Team &amp; stakeholder management</text>
      <text x="100" y="82" font-size="22" font-weight="400" fill="#734D33">Onboard clinical &amp; non-clinical staff with a single tap</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(290,1180)" filter="url(#shadow)">
    <rect width="500" height="80" rx="40" fill="url(#emerald)"/>
    <text x="250" y="52" font-family="Helvetica Neue, Helvetica, Arial" font-size="30" font-weight="700"
          text-anchor="middle" fill="#FFFFFF">Now live on TestFlight</text>
  </g>

  <text x="540" y="1310" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="400"
        text-anchor="middle" fill="#734D33">v1.0.1 · Requires iOS 18 · iPhone &amp; iPad · Made with care</text>
</svg>
