<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1C7836"/>
      <stop offset="55%" stop-color="#33AB54"/>
      <stop offset="100%" stop-color="#33AB54"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F7FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Left emerald panel -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="500" y="0" width="700" height="675" fill="url(#panel)"/>

  <!-- Decorative geometry -->
  <circle cx="80" cy="80" r="28" fill="#C21F33" opacity="0.9"/>
  <circle cx="160" cy="600" r="18" fill="#FFFFFF" opacity="0.7"/>
  <polygon points="500,0 580,0 500,120" fill="#1C7836"/>

  <!-- App icon -->
  <g filter="url(#shadow)" transform="translate(180,200)">
    <rect width="220" height="220" rx="50" fill="#FFFFFF"/>
    <image href="app_icon.png" x="0" y="0" width="220" height="220"/>
  </g>

  <!-- Wordmark over emerald -->
  <text x="290" y="160" font-family="Helvetica Neue, Helvetica, Arial" font-size="34" font-weight="700"
        text-anchor="middle" fill="#FFFFFF" letter-spacing="2">AGED CARE SHARED</text>

  <!-- Right content -->
  <text x="560" y="170" font-family="Helvetica Neue, Helvetica, Arial" font-size="60" font-weight="800" fill="#452917">Aged Care,</text>
  <text x="560" y="240" font-family="Helvetica Neue, Helvetica, Arial" font-size="60" font-weight="800" fill="#1C7836">Reimagined.</text>
  <text x="560" y="295" font-family="Helvetica Neue, Helvetica, Arial" font-size="26" font-weight="400" fill="#734D33">Compassionate care, intelligently connected.</text>

  <!-- Feature bullets -->
  <g font-family="Helvetica Neue, Helvetica, Arial" font-size="24" font-weight="500" fill="#452917">
    <g transform="translate(560,340)">
      <circle cx="14" cy="14" r="10" fill="#C21F33"/>
      <text x="40" y="22">Instant SOS &amp; CloudKit-synced alerts</text>
    </g>
    <g transform="translate(560,390)">
      <circle cx="14" cy="14" r="10" fill="#33AB54"/>
      <text x="40" y="22">WeatherKit + indoor comfort monitoring</text>
    </g>
    <g transform="translate(560,440)">
      <circle cx="14" cy="14" r="10" fill="#1C7836"/>
      <text x="40" y="22">Staff &amp; stakeholder management</text>
    </g>
    <g transform="translate(560,490)">
      <circle cx="14" cy="14" r="10" fill="#452917"/>
      <text x="40" y="22">Resident-first, privacy-respecting design</text>
    </g>
  </g>

  <!-- CTA pill -->
  <g transform="translate(560,560)" filter="url(#shadow)">
    <rect width="380" height="64" rx="32" fill="#1C7836"/>
    <text x="190" y="42" font-family="Helvetica Neue, Helvetica, Arial" font-size="26" font-weight="700"
          text-anchor="middle" fill="#FFFFFF">Now live on TestFlight</text>
  </g>

  <!-- Tagline footer -->
  <text x="290" y="540" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="400"
        text-anchor="middle" fill="#FFFFFF" opacity="0.9">v1.0.1 · iOS 18 · iPhone &amp; iPad</text>
</svg>
