<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#D4DDE5"/>
    </linearGradient>
    <radialGradient id="ruby" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF3B5C"/>
      <stop offset="60%" stop-color="#C21F33"/>
      <stop offset="100%" stop-color="#8C0E1F"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Section eyebrow -->
  <rect x="380" y="280" width="320" height="60" rx="30" fill="#C21F33" opacity="0.12"/>
  <text x="540" y="320" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" font-weight="700"
        text-anchor="middle" fill="#C21F33" letter-spacing="3">SAFETY FIRST</text>

  <!-- Pulse rings around SOS -->
  <circle cx="540" cy="780" r="380" fill="none" stroke="#C21F33" stroke-width="3" opacity="0.18"/>
  <circle cx="540" cy="780" r="320" fill="none" stroke="#C21F33" stroke-width="3" opacity="0.28"/>
  <circle cx="540" cy="780" r="260" fill="none" stroke="#C21F33" stroke-width="3" opacity="0.4"/>

  <!-- SOS button -->
  <g filter="url(#shadow)">
    <circle cx="540" cy="780" r="200" fill="url(#ruby)"/>
    <text x="540" y="820" font-family="Helvetica Neue, Helvetica, Arial" font-size="120" font-weight="900"
          text-anchor="middle" fill="#FFFFFF" letter-spacing="6">SOS</text>
  </g>

  <!-- Headline -->
  <text x="540" y="1230" font-family="Helvetica Neue, Helvetica, Arial" font-size="84" font-weight="800"
        text-anchor="middle" fill="#452917">Instant alerts.</text>
  <text x="540" y="1330" font-family="Helvetica Neue, Helvetica, Arial" font-size="84" font-weight="800"
        text-anchor="middle" fill="#C21F33">Anywhere, anytime.</text>

  <text x="540" y="1430" font-family="Helvetica Neue, Helvetica, Arial" font-size="36" font-weight="400"
        text-anchor="middle" fill="#734D33">CloudKit-synced escalation across</text>
  <text x="540" y="1480" font-family="Helvetica Neue, Helvetica, Arial" font-size="36" font-weight="400"
        text-anchor="middle" fill="#734D33">every member of the care team.</text>

  <!-- Mini badges -->
  <g font-family="Helvetica Neue, Helvetica, Arial" font-size="26" font-weight="600">
    <g transform="translate(140,1640)">
      <rect width="240" height="76" rx="38" fill="#FFFFFF" stroke="#C21F33" stroke-width="3"/>
      <text x="120" y="48" text-anchor="middle" fill="#C21F33">Priority routing</text>
    </g>
    <g transform="translate(420,1640)">
      <rect width="240" height="76" rx="38" fill="#FFFFFF" stroke="#C21F33" stroke-width="3"/>
      <text x="120" y="48" text-anchor="middle" fill="#C21F33">Live status</text>
    </g>
    <g transform="translate(700,1640)">
      <rect width="240" height="76" rx="38" fill="#FFFFFF" stroke="#C21F33" stroke-width="3"/>
      <text x="120" y="48" text-anchor="middle" fill="#C21F33">Audit log</text>
    </g>
  </g>
</svg>
