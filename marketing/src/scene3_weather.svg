<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5EE"/>
      <stop offset="100%" stop-color="#F5F7FA"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33AB54"/>
      <stop offset="100%" stop-color="#1C7836"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#F4A41C"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Eyebrow -->
  <rect x="340" y="280" width="400" height="60" rx="30" fill="#33AB54" opacity="0.15"/>
  <text x="540" y="320" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" font-weight="700"
        text-anchor="middle" fill="#1C7836" letter-spacing="3">COMFORT &amp; CONTEXT</text>

  <!-- Weather card mock -->
  <g filter="url(#shadow)" transform="translate(120,420)">
    <rect width="840" height="540" rx="44" fill="#FFFFFF"/>

    <!-- Location row -->
    <circle cx="60" cy="64" r="14" fill="#33AB54"/>
    <text x="92" y="74" font-family="Helvetica Neue, Helvetica, Arial" font-size="30" font-weight="600" fill="#452917">Sunshine Coast Care Facility</text>

    <!-- Sun + outdoor temp -->
    <circle cx="180" cy="240" r="90" fill="url(#sun)"/>
    <text x="320" y="220" font-family="Helvetica Neue, Helvetica, Arial" font-size="100" font-weight="800" fill="#452917">24°</text>
    <text x="320" y="280" font-family="Helvetica Neue, Helvetica, Arial" font-size="30" font-weight="500" fill="#734D33">Sunny · Outdoor</text>

    <!-- Divider -->
    <line x1="40" y1="360" x2="800" y2="360" stroke="#D4DDE5" stroke-width="2"/>

    <!-- Grid -->
    <g font-family="Helvetica Neue, Helvetica, Arial">
      <text x="60" y="420" font-size="24" font-weight="500" fill="#734D33">Room temp</text>
      <text x="60" y="480" font-size="48" font-weight="800" fill="#1C7836">23°C</text>

      <text x="320" y="420" font-size="24" font-weight="500" fill="#734D33">Humidity</text>
      <text x="320" y="480" font-size="48" font-weight="800" fill="#1C7836">52%</text>

      <text x="580" y="420" font-size="24" font-weight="500" fill="#734D33">Comfort</text>
      <text x="580" y="480" font-size="48" font-weight="800" fill="#33AB54">Optimal</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="540" y="1130" font-family="Helvetica Neue, Helvetica, Arial" font-size="84" font-weight="800"
        text-anchor="middle" fill="#452917">Weather &amp; comfort,</text>
  <text x="540" y="1230" font-family="Helvetica Neue, Helvetica, Arial" font-size="84" font-weight="800"
        text-anchor="middle" fill="#1C7836">at a glance.</text>

  <text x="540" y="1330" font-family="Helvetica Neue, Helvetica, Arial" font-size="36" font-weight="400"
        text-anchor="middle" fill="#734D33">WeatherKit + CoreLocation deliver</text>
  <text x="540" y="1380" font-family="Helvetica Neue, Helvetica, Arial" font-size="36" font-weight="400"
        text-anchor="middle" fill="#734D33">real-time conditions to every caregiver.</text>

  <!-- Mini badges -->
  <g font-family="Helvetica Neue, Helvetica, Arial" font-size="26" font-weight="600">
    <g transform="translate(140,1540)">
      <rect width="240" height="76" rx="38" fill="url(#emerald)"/>
      <text x="120" y="48" text-anchor="middle" fill="#FFFFFF">WeatherKit</text>
    </g>
    <g transform="translate(420,1540)">
      <rect width="240" height="76" rx="38" fill="url(#emerald)"/>
      <text x="120" y="48" text-anchor="middle" fill="#FFFFFF">CoreLocation</text>
    </g>
    <g transform="translate(700,1540)">
      <rect width="240" height="76" rx="38" fill="url(#emerald)"/>
      <text x="120" y="48" text-anchor="middle" fill="#FFFFFF">Room insight</text>
    </g>
  </g>
</svg>
