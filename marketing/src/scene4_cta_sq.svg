<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33AB54"/>
      <stop offset="50%" stop-color="#1C7836"/>
      <stop offset="100%" stop-color="#0E3D1B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- App icon -->
  <g filter="url(#shadow)" transform="translate(390,120)">
    <rect width="300" height="300" rx="70" fill="#FFFFFF"/>
    <image href="app_icon.png" x="0" y="0" width="300" height="300"/>
  </g>

  <!-- Headline -->
  <text x="540" y="550" font-family="Helvetica Neue, Helvetica, Arial" font-size="84" font-weight="800"
        text-anchor="middle" fill="#FFFFFF">Now live on</text>
  <text x="540" y="650" font-family="Helvetica Neue, Helvetica, Arial" font-size="84" font-weight="800"
        text-anchor="middle" fill="#F5F7FA">TestFlight.</text>

  <text x="540" y="740" font-family="Helvetica Neue, Helvetica, Arial" font-size="32" font-weight="400"
        text-anchor="middle" fill="#F5F7FA" opacity="0.9">Join the beta and reshape aged care with us.</text>

  <!-- CTA button -->
  <g transform="translate(290,820)" filter="url(#shadow)">
    <rect width="500" height="100" rx="50" fill="#FFFFFF"/>
    <text x="250" y="65" font-family="Helvetica Neue, Helvetica, Arial" font-size="36" font-weight="800"
          text-anchor="middle" fill="#1C7836">Request access</text>
  </g>

  <!-- Footer -->
  <text x="540" y="980" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" font-weight="400"
        text-anchor="middle" fill="#F5F7FA" opacity="0.8">v1.0.1 · iOS 18 · iPhone &amp; iPad</text>
</svg>
