<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#E8ECF0"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33AB54"/>
      <stop offset="100%" stop-color="#1C7836"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1290" height="2796" fill="url(#bg)"/>

  <!-- Shield icon -->
  <g transform="translate(545,380)">
    <rect x="0" y="0" width="200" height="240" rx="48" fill="url(#emerald)"/>
    <text x="100" y="158" font-family="Helvetica Neue, Helvetica, Arial" font-size="100" font-weight="900"
          text-anchor="middle" fill="#FFFFFF">⌂</text>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(430,720)">
    <rect width="430" height="60" rx="30" fill="#33AB54" opacity="0.15"/>
    <text x="215" y="40" font-family="Helvetica Neue, Helvetica, Arial" font-size="26" font-weight="700"
          text-anchor="middle" fill="#1C7836" letter-spacing="3">PRIVACY BY DESIGN</text>
  </g>

  <!-- Headline -->
  <text x="645" y="900" font-family="Helvetica Neue, Helvetica, Arial" font-size="86" font-weight="800"
        text-anchor="middle" fill="#452917">Your data never</text>
  <text x="645" y="1000" font-family="Helvetica Neue, Helvetica, Arial" font-size="86" font-weight="800"
        text-anchor="middle" fill="#1C7836">leaves the device.</text>

  <text x="645" y="1090" font-family="Helvetica Neue, Helvetica, Arial" font-size="32" font-weight="400"
        text-anchor="middle" fill="#734D33">On-device AI means camera feeds and audio stay private.</text>
  <text x="645" y="1140" font-family="Helvetica Neue, Helvetica, Arial" font-size="32" font-weight="400"
        text-anchor="middle" fill="#734D33">Only incident records are synced — and only when you choose.</text>

  <!-- Feature blocks -->
  <g font-family="Helvetica Neue, Helvetica, Arial">
    <g transform="translate(120,1320)" filter="url(#shadow)">
      <rect width="1050" height="120" rx="22" fill="#FFFFFF"/>
      <circle cx="60" cy="60" r="24" fill="#C21F33"/>
      <text x="36" y="40" font-size="18" font-weight="400" fill="#1C7836" letter-spacing="2">CAMERA</text>
      <text x="36" y="70" font-size="28" font-weight="700" fill="#452917">Analyzed on-device with CoreML</text>
      <text x="36" y="100" font-size="22" font-weight="400" fill="#734D33">Only persists clips when an incident is detected and retained by staff</text>
    </g>
    <g transform="translate(120,1460)" filter="url(#shadow)">
      <rect width="1050" height="120" rx="22" fill="#FFFFFF"/>
      <circle cx="60" cy="60" r="24" fill="#33AB54"/>
      <text x="36" y="40" font-size="18" font-weight="400" fill="#1C7836" letter-spacing="2">MICROPHONE</text>
      <text x="36" y="70" font-size="28" font-weight="700" fill="#452917">On-device SoundAnalysis</text>
      <text x="36" y="100" font-size="22" font-weight="400" fill="#734D33">Distress detection happens locally — no audio uploaded to any server</text>
    </g>
    <g transform="translate(120,1600)" filter="url(#shadow)">
      <rect width="1050" height="120" rx="22" fill="#FFFFFF"/>
      <circle cx="60" cy="60" r="24" fill="#1C7836"/>
      <text x="36" y="40" font-size="18" font-weight="400" fill="#1C7836" letter-spacing="2">DATA</text>
      <text x="36" y="70" font-size="28" font-weight="700" fill="#452917">Zero third-party analytics</text>
      <text x="36" y="100" font-size="22" font-weight="400" fill="#734D33">No tracking SDKs. No advertising. No data sold. Ever.</text>
    </g>
    <g transform="translate(120,1740)" filter="url(#shadow)">
      <rect width="1050" height="120" rx="22" fill="#FFFFFF"/>
      <circle cx="60" cy="60" r="24" fill="#452917"/>
      <text x="36" y="40" font-size="18" font-weight="400" fill="#1C7836" letter-spacing="2">ACCOUNT</text>
      <text x="36" y="70" font-size="28" font-weight="700" fill="#452917">Delete your data in one tap</text>
      <text x="36" y="100" font-size="22" font-weight="400" fill="#734D33">Settings → Account → Delete Account — complete purge</text>
    </g>
  </g>

  <!-- Footer badge -->
  <g transform="translate(345,2040)">
    <rect width="600" height="70" rx="35" fill="#1C7836"/>
    <text x="300" y="46" font-family="Helvetica Neue, Helvetica, Arial" font-size="26" font-weight="700"
          text-anchor="middle" fill="#FFFFFF">HIPAA-ready architecture</text>
  </g>

  <text x="645" y="2180" font-family="Helvetica Neue, Helvetica, Arial" font-size="24" font-weight="400"
        text-anchor="middle" fill="#734D33" opacity="0.8">AgedCare Monitor · privacy-respecting · on-device</text>
</svg>
