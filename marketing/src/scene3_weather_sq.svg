<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5EE"/>
      <stop offset="100%" stop-color="#F5F7FA"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#F4A41C"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Weather card mock centered -->
  <g filter="url(#shadow)" transform="translate(140,150)">
    <rect width="800" height="480" rx="44" fill="#FFFFFF"/>
    <circle cx="160" cy="180" r="80" fill="url(#sun)"/>
    <text x="300" y="160" font-family="Helvetica Neue, Helvetica, Arial" font-size="90" font-weight="800" fill="#452917">24°</text>
    <text x="300" y="220" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" font-weight="500" fill="#734D33">Sunny · Outdoor</text>

    <line x1="40" y1="300" x2="760" y2="300" stroke="#D4DDE5" stroke-width="2"/>
    <g font-family="Helvetica Neue, Helvetica, Arial">
      <text x="60" y="360" font-size="22" font-weight="500" fill="#734D33">Room temp</text>
      <text x="60" y="420" font-size="44" font-weight="800" fill="#1C7836">23°C</text>
      <text x="320" y="360" font-size="22" font-weight="500" fill="#734D33">Humidity</text>
      <text x="320" y="420" font-size="44" font-weight="800" fill="#1C7836">52%</text>
      <text x="580" y="360" font-size="22" font-weight="500" fill="#734D33">Comfort</text>
      <text x="580" y="420" font-size="44" font-weight="800" fill="#33AB54">Optimal</text>
    </g>
  </g>

  <!-- Headline -->
  <text x="540" y="750" font-family="Helvetica Neue, Helvetica, Arial" font-size="72" font-weight="800"
        text-anchor="middle" fill="#452917">Weather &amp; comfort,</text>
  <text x="540" y="840" font-family="Helvetica Neue, Helvetica, Arial" font-size="72" font-weight="800"
        text-anchor="middle" fill="#1C7836">at a glance.</text>

  <text x="540" y="920" font-family="Helvetica Neue, Helvetica, Arial" font-size="32" font-weight="400"
        text-anchor="middle" fill="#734D33">WeatherKit + CoreLocation powered insights.</text>
</svg>
