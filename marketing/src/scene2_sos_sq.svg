<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F7FA"/>
      <stop offset="100%" stop-color="#D4DDE5"/>
    </linearGradient>
    <radialGradient id="ruby" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF3B5C"/>
      <stop offset="60%" stop-color="#C21F33"/>
      <stop offset="100%" stop-color="#8C0E1F"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Pulse rings around SOS -->
  <circle cx="540" cy="450" r="300" fill="none" stroke="#C21F33" stroke-width="3" opacity="0.18"/>
  <circle cx="540" cy="450" r="240" fill="none" stroke="#C21F33" stroke-width="3" opacity="0.28"/>

  <!-- SOS button -->
  <g filter="url(#shadow)">
    <circle cx="540" cy="450" r="160" fill="url(#ruby)"/>
    <text x="540" y="485" font-family="Helvetica Neue, Helvetica, Arial" font-size="100" font-weight="900"
          text-anchor="middle" fill="#FFFFFF" letter-spacing="6">SOS</text>
  </g>

  <!-- Headline -->
  <text x="540" y="750" font-family="Helvetica Neue, Helvetica, Arial" font-size="72" font-weight="800"
        text-anchor="middle" fill="#452917">Instant alerts.</text>
  <text x="540" y="840" font-family="Helvetica Neue, Helvetica, Arial" font-size="72" font-weight="800"
        text-anchor="middle" fill="#C21F33">Anywhere, anytime.</text>

  <text x="540" y="920" font-family="Helvetica Neue, Helvetica, Arial" font-size="32" font-weight="400"
        text-anchor="middle" fill="#734D33">CloudKit-synced escalation for the whole team.</text>
</svg>
